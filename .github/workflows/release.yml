name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Test
        run: go test ./... -count=1
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${VERSION#v}"
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="mikvoc_${VERSION}_${os}_${arch}"
            binary="mikvoc"
            if [ "$os" = "windows" ]; then binary="mikvoc.exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -buildvcs=false \
              -trimpath \
              -ldflags="-s -w -X mikvoc/internal/core.Version=$version" \
              -o "dist/$binary" ./cmd/mikvoc
            if [ "$os" = "windows" ]; then
              (cd dist && zip -q "${name}.zip" "$binary")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "$binary"
            fi
            rm "dist/$binary"
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --title "MikVoc ${{ github.ref_name }}"
